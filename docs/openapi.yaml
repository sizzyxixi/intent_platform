              used_by:
                type: array
                items:
                  type: string
              items:
                type: array
                items:
                  type: object
                  properties:
                    chunk_id:
                      type: string
                    content:
                      type: string
                    cells:
                      type: object
                      additionalProperties:
                        type: string
                    tags:
                      $ref: '#/components/schemas/ScopeTags'
