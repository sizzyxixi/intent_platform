  /api/v1/runtime-config:
    get:
      tags:
      - 运行时
      operationId: getRuntimeConfig
      summary: 拉取当前空间的运行时配置（供 Bot / 智能体使用）
      description: '这个接口是给 Bot / 智能体运行时用的：按空间返回全部「已启用」意图的完整配置（意图描述、例句、槽位及生效追问话术、关联知识及用途、工具及入参映射与类型），以及本空间的槽位定义、校验集全文（validation_sets）和工具清单，并带 version。

        给 AI 的说明：整理意图时不要用这个接口（它只含已启用意图，也不能写入）；整理请用 intents 系列接口。

        Bot 用法（完整流程见 AI 接入说明第 5 节）：识别 → 按 recognition.threshold 判定命中，否则列出 ≥ candidate_min 的候选澄清（最多 max_clarify 次）→ 缺必填槽位用 slots[].ask 追问（每个最多 max_slot_ask 次）→ 检索参考知识、生成后用 validation_sets 逐条校验 → 调用工具（失败重试 tool_retry 次）→ 任一环节超限或失败执行 recognition.final_action。

        工具执行规则（平台只登记，执行在 Bot）：http=按 method + url 发请求，入参按 input_schema 组装为 query（GET）或 JSON body，鉴权凭据由 Bot 侧托管；mcp=连接 mcp_server 调用 tools/call，name=mcp_tool，arguments=入参；cli=在 Bot 运行环境中用 cli.bin 执行 cli.command_template，把 {参数名} 替换为入参值，选填参数为空时连同其前面的 --选项 一起省略，执行前按 cli.install 安装并按 cli.login_command 完成鉴权，output_format=json 时解析 stdout 为 JSON，confirm_required=true 时先向用户确认；skill=下载 skill.download_path 的技能包（按 skill.version 缓存），把 SKILL.md 交给 AI，本意图抽取的槽位作为上下文，不做入参映射，输出格式按意图回复要求；workflow=按 workflow.platform 调用：dify 为 POST {base_url}/workflows/run（body: inputs、response_mode、user），coze 为 POST https://api.coze.cn|com/v1/workflow/run（streaming 时 /v1/workflow/stream_run；body: workflow_id、parameters 及可选 workflow_version、is_async、bot_id、app_id、ext），generic 为按 url + method 发送 {inputs}；凭据从 workflow.auth_env 指定的环境变量读取，以 Bearer 放在 Authorization；output_mapping 把返回字段（如 data.outputs.result）映射为结果名；confirm_required=true 时先向用户确认。mcp 服务的凭据按 mcp_server.credentials 逐条放到请求头（scheme=Bearer 时加 Bearer 前缀）、URL 参数或 stdio 环境变量，值取自各自的 env。

        '
      parameters:
      - name: since_version
        in: query
        schema:
          type: integer
          minimum: 0
          example: 41
        description: Bot 当前持有的版本号；与最新版本相同时返回 304。若同时传了 max_depth 或 parent，则始终返回 200（只切片 taxonomy.categories）。
      - $ref: '#/components/parameters/TaxonomyMaxDepth'
      - $ref: '#/components/parameters/TaxonomyParent'
      responses:
        '200':
          description: 最新运行时配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeConfig'
              example:
                space:
                  id: cs
                  name: 1688 智能客服
                  bot: 客服 Bot（吴钢）
                version: 60
                generated_at: '2026-11-11T09:41:35Z'
                recognition:
                  threshold: 0.6
                  candidate_min: 0.3
                  max_candidates: 3
                  max_clarify: 2
                  max_slot_ask: 2
                  tool_retry: 1
                  final_action: handoff_human
                  final_action_label: 转人工
                  clarify_prompt: 我想确认一下，您是想要以下哪一项？
                  final_message: null
                taxonomy:
                  levels:
                  - depth: 1
                    name: 阶段
                  intent_level_name: 意图
                  categories:
                  - code: PRE
                    name: 售前
                    depth: 1
                    children: []
                  - code: MID
                    name: 售中
                    depth: 1
                    children: []
                  - code: POST
                    name: 售后
                    depth: 1
                    children: []
                  - code: NONE
                    name: 非询盘
                    depth: 1
                    children: []
                slots:
                - name: shop_id
                  display_name: 店铺
                  type: 文本
                  default_ask: （不向买家追问：由 Bot 按会话所属的 1688 店铺带入 ERP 店铺 ID）
                - name: order_id
                  display_name: 订单号
                  type: 文本
                  default_ask: 麻烦发一下订单号～
                intents:
                - code: B.MID.CHANGE_ORDER
                  name: 售中改价改单
                  category_path:
                  - code: MID
                    name: 售中
                  description: 买家已拍下或已下单，要求修改订单价格、数量或运费；说「拍好了帮我改价」「数量改成 200」算；还没下单的议价不算（→ 比价中）
                  examples:
                  - 拍好了帮我改下价
                  - 订单数量改成200件
