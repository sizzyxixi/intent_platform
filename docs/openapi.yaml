          type: string
          example: 平台
        type:
          type: string
          enum:
          - 文本
          - 数字
          - 日期
          - 枚举
          - 文件
          - 图片
        options:
          type: array
          items:
            type: string
          description: 可选值，仅 type=枚举 时必填
          example:
          - TikTok
          - Shopee
          - Amazon
        default_ask:
          type: string
          example: 请问是哪个平台？
        used_by:
          type: array
          readOnly: true
          items:
            type: string
          description: 本空间使用该槽位的意图编码
    SlotUpdate:
      type: object
      properties:
        display_name:
          type: string
        type:
          type: string
          enum:
          - 文本
          - 数字
          - 日期
          - 枚举
          - 文件
          - 图片
        options:
          type: array
          items:
            type: string
        default_ask:
          type: string
    ScopeTags:
      type: object
      properties:
        platform:
          type: array
          items:
            type: string
        site:
          type: array
          items:
            type: string
        language:
          type: array
          items:
            type: string
        category:
          type: array
          items:
            type: string
      example:
        platform:
        - TikTok
        site:
        - US
        language:
        - en
        category: []
    Recognition:
      type: object
      description: 空间设置（每个空间一份）：识别阈值、澄清、槽位追问、工具失败重试与未匹配兜底。兜底请读 fallback（与意图 handling 同一套 mode，不含 tool_flow）。final_action / final_message 仍返回以兼容旧读取方。
      required:
      - threshold
      - candidate_min
      - max_candidates
      - max_clarify
      - max_slot_ask
      - tool_retry
      - final_action
      - clarify_prompt
      properties:
        threshold:
          type: number
          minimum: 0
          maximum: 1
          example: 0.6
          description: 识别阈值，Top1 置信度 ≥ 阈值算命中。数值含义由 Bot 的识别模型决定，建议用单句测试和实际对话校准
        candidate_min:
          type: number
          minimum: 0
          maximum: 1
          example: 0.3
          description: 澄清候选下限，等于 threshold ÷ 2（只读，由平台计算）
        max_candidates:
          type: integer
          example: 3
          description: 澄清时最多列出的候选数
        max_clarify:
          type: integer
          minimum: 0
          maximum: 5
          example: 2
          description: 澄清最多次数，超过执行 final_action
        max_slot_ask:
          type: integer
          minimum: 0
          maximum: 5
          example: 2
          description: 每个必填槽位最多追问次数，超过执行 final_action
        tool_retry:
          type: integer
          minimum: 0
          maximum: 3
          example: 1
          description: 工具调用失败后的重试次数，仍失败执行 final_action
        final_action:
          type: string
          enum:
          - handoff_human
          - general_assistant
          - decline
          example: general_assistant
          description: handoff_human=转人工；general_assistant=交给通用助手；decline=告知无法处理（回复 final_message）
        final_action_label:
          type: string
          example: 交给通用助手
        clarify_prompt:
          type: string
          example: 我想确认一下，您是想要以下哪一项？
        final_message:
          type: string
          nullable: true
          description: 兼容字段。fallback.mode=fixed_reply（旧 final_action=decline）时为第一条话术，其余为 null
        fallback:
          $ref: '#/components/schemas/Fallback'
    RecognitionUpdate:
      type: object
      description: 更新空间设置；只传要改的字段。candidate_min 由平台按 threshold ÷ 2 计算，不可写。
      properties:
        threshold:
          type: number
          minimum: 0
          maximum: 1
          example: 0.6
          description: 识别阈值，Top1 置信度 ≥ 阈值算命中。数值含义由 Bot 的识别模型决定，建议用单句测试和实际对话校准
        max_clarify:
          type: integer
          minimum: 0
          maximum: 5
          example: 2
          description: 澄清最多次数，超过执行 final_action
        max_slot_ask:
          type: integer
          minimum: 0
          maximum: 5
          example: 2
          description: 每个必填槽位最多追问次数，超过执行 final_action
        tool_retry:
          type: integer
          minimum: 0
          maximum: 3
          example: 1
          description: 工具调用失败后的重试次数，仍失败执行 final_action
        final_action:
          type: string
          enum:
          - handoff_human
          - general_assistant
          - decline
          example: general_assistant
          description: handoff_human=转人工；general_assistant=交给通用助手；decline=告知无法处理（回复 final_message）
        clarify_prompt:
          type: string
          example: 我想确认一下，您是想要以下哪一项？
        final_message:
          type: string
          nullable: true
          description: 兼容写入：final_action=decline 时必填。推荐改用 fallback。
        fallback:
          $ref: '#/components/schemas/Fallback'
          description: 推荐。设置未匹配时的兜底处理方式（与意图 handling 同一套 mode，不含 tool_flow）。与 final_action 同时传入时以 fallback 为准。
    CategoryRef:
      type: object
      required:
      - code
      - name
      properties:
        code:
          type: string
          nullable: true
          description: 分类编码；只有部分层级（通常是第一层）有编码
          example: STOCK
        name:
          type: string
          example: 库存与货期
    CategoryPath:
      type: array
      description: 从第 1 层到最末层分类的路径；空间没有分类层时为空数组
      items:
        $ref: '#/components/schemas/CategoryRef'
      example:
      - code: STOCK
        name: 库存与货期
      - code: null
        name: 现货

    TaxonomyNodeInput:
      type: object
      required: [name]
      properties:
        id: {type: integer, description: 已有节点 id；无编码节点必须用 id 更新}
        code: {type: string, description: 稳定编码，可选；与 id 至少提供一个以更新已有节点}
        name: {type: string}
        parent_code: {type: string}
        depth: {type: integer}
        level: {type: integer}
        sort: {type: integer}
        description: {type: string}
        dry_run: {type: boolean}
    TaxonomyNode:
      type: object
      required: [name, depth, enabled]
      properties:
        id: {type: integer}
        code: {type: string, nullable: true}
        name: {type: string}
        depth: {type: integer}
        parent_code: {type: string, nullable: true}
        description: {type: string}
        sort: {type: integer}
        enabled: {type: boolean}
        action: {type: string}
    KbRefInput:
      type: object
      required: [kb_id, doc_id, chunk_id]
      properties:
        kb_id: {type: string}
        doc_id: {type: string}
        chunk_id: {type: string}
        usage: {type: string, enum: [reference, validate]}
        dry_run: {type: boolean}
    CategoryNode:
      type: object
      required:
      - code
      - name
      - depth
      - children
      - has_children
      - child_count
      properties:
        id:
          type: integer
          description: 节点 id，可作 parent 参数以继续下钻
        code:
          type: string
          nullable: true
        name:
          type: string
        depth:
          type: integer
          minimum: 1
        enabled:
          type: boolean
        description:
          type: string
        sort:
          type: integer
        has_children:
          type: boolean
          description: 该节点在完整树中是否有子分类（不受 max_depth 截断影响）
        child_count:
          type: integer
          minimum: 0
          description: 该节点在完整树中的直接子分类数量（不受 max_depth 截断影响）
        children:
          type: array
          items:
            $ref: '#/components/schemas/CategoryNode'
    TaxonomyLevels:
      type: object
      required:
      - levels
      - intent_level_name
      properties:
        levels:
          type: array
          description: 分类层级定义（不含意图层），按 depth 排序；0～5 个
          items:
            type: object
            required:
            - depth
            - name
            properties:
              depth:
                type: integer
              name:
                type: string
          example:
          - depth: 1
            name: 阶段
        intent_level_name:
          type: string
          example: 意图
          description: 最末层（意图层）的显示名称
    Taxonomy:
      allOf:
      - $ref: '#/components/schemas/TaxonomyLevels'
      - type: object
        required:
        - categories
        properties:
          categories:
            type: array
            items:
              $ref: '#/components/schemas/CategoryNode'
          parent:
            type: object
            description: 仅在传入 parent 参数时出现，描述本轮起点节点（categories 是它的子节点）
            properties:
              id:
                type: integer
              code:
                type: string
                nullable: true
              name:
                type: string
              depth:
                type: integer
              description:
                type: string
              has_children:
                type: boolean
              child_count:
                type: integer
    McpServerConn:
      type: object
      required:
      - name
      - display_name
      - transport
      - credentials
      description: MCP 服务连接信息。第三方 MCP 通常一个服务打包多项能力，平台按「服务 → 子工具」两级登记；不含任何密钥值，凭据只给位置、名称和环境变量名，URL 中的密钥参数会被去掉。
      properties:
        name:
          type: string
          example: compliance
          description: 服务名（小写字母/数字/下划线），子工具名为 {服务名}.{远端工具名}
        display_name:
          type: string
        group:
          type: string
          nullable: true
          maxLength: 200
          description: 可选。业务分组。登记或更新服务时写入，会应用到该服务下的子工具。
        transport:
          type: string
          enum:
          - streamable_http
          - sse
          - stdio
        url:
          type: string
          description: transport=streamable_http / sse
        command:
          type: string
          description: transport=stdio
        args:
          type: array
          items:
            type: string
          description: transport=stdio
        env:
          type: object
          additionalProperties:
            type: string
          description: transport=stdio，非敏感环境变量
        auth:
          type: object
          required:
          - type
          properties:
            type:
              type: string
              enum:
              - 无
              - Bearer Token
              - API Key
              - 环境变量
              - URL 参数
            header:
              type: string
              example: Authorization
            scheme:
              type: string
              example: Bearer
            token_env:
              type: string
              example: MCP_COMPLIANCE_TOKEN
              description: Bot 运行环境中保存密钥的环境变量名
            query:
              type: string
            env:
              type: string
          description: 已废弃（兼容 v0.6）：第一条凭据的摘要；新接入请读 credentials
        credentials:
          type: array
          description: 鉴权凭据。Bot 按顺序把环境变量 env 的值放到对应位置：header=请求头（scheme=Bearer 时值为 "Bearer <值>"）；query=URL 参数；env=stdio 进程的环境变量
          items:
            type: object
            required:
            - location
            - name
            - env
            properties:
              location:
                type: string
                enum:
                - header
                - query
                - env
              name:
                type: string
                example: secret-key
                description: 请求头名 / URL 参数名 / 环境变量名
              env:
                type: string
                example: SELLERSPRITE_SECRET_KEY
                description: Bot 运行环境中保存密钥的环境变量名
              scheme:
                type: string
                enum:
                - Bearer
