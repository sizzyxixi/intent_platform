          $ref: '#/components/schemas/IntentCode'
        name:
          type: string
          maxLength: 30
        category_path:
          type: array
          items:
            type: string
          description: 从第 1 层到最末层分类的完整路径，每段填该层的编码或名称（如 ["STOCK", "现货"]）；层数必须等于 taxonomy.levels 的长度。空间有分类层时必填（或用兼容字段 l1/l2）
          example:
          - STOCK
          - 现货
        l1:
          type: string
          deprecated: true
          description: 0.5 版字段（兼容）：等价于 category_path 第 1 段
        l2:
          type: string
          deprecated: true
          description: 0.5 版字段（兼容）：等价于 category_path 第 2 段
        description:
          type: string
          minLength: 15
          description: 意图描述。这段描述会被大模型分类和语义匹配使用，至少 15 个字。请写清：用户想做什么；什么情况算这个意图；什么情况不算（容易和哪个意图混淆）。示例：用户想为商品生成符合平台规范的主图；"做主图""首图"算；只要换白底不算（→ M.DESIGN.WHITE_BG）
        examples:
          type: array
          minItems: 3
          items:
            type: string
          description: 用户原话风格的例句，至少 3 条，不要重复
        slots:
          type: array
          items:
            $ref: '#/components/schemas/Slot'
    IntentPatch:
