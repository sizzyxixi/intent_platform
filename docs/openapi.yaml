  /api/v1/kbs/{kb_id}/documents:import:
    parameters:
    - $ref: '#/components/parameters/KbId'
    post:
      tags:
      - 知识库
      operationId: importDocuments
      summary: 向知识库导入文档
      description: '何时用：把整理好的问答表或文档导入到已有知识库。导入为异步构建，返回 202 和 import_id，用 GET /api/v1/imports/{import_id} 查询结果。

        规则：

        - 表格知识库支持 .xlsx .xls .csv .json .jsonl，表头必须与知识库完全一致（列名与顺序），否则 400 HEADER_MISMATCH。

        - 图文知识库支持 .docx .doc .pdf .pptx .ppt .html .htm .md .png .jpg .jpeg .webp。

        - 与已有文档名称或内容相同会覆盖并更新原文档；未传 overwrite=true 时返回 409，响应中列出受影响的关联意图。AI 遇到 409 时应停下并请运营确认，不要自行加 overwrite=true 重试。

        何时不用：只改一条切片时用 PUT /api/v1/kbs/{kb_id}/chunks/{chunk_id}。


        全局接口：知识库与工具全平台通用，不需要 X-Space-Id（传了也会忽略）。

        '
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - files
              properties:
                files:
                  type: array
                  maxItems: 100
                  items:
                    type: string
                    format: binary
                overwrite:
                  type: boolean
                  default: false
                  description: 同名/同内容文档是否覆盖。必须由运营确认后才可设为 true。
      responses:
        '202':
          description: 已受理，构建中
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportTask'
              example:
                import_id: IMP-1013
                status: 构建中
                documents:
                - name: 开票与发票规则.md
                  action: created
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
