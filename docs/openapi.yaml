            - description
            - examples
            - slots
            - knowledge
            - tools
            properties:
              code:
                $ref: '#/components/schemas/IntentCode'
              name:
                type: string
              category_path:
                $ref: '#/components/schemas/CategoryPath'
              description:
                type: string
              examples:
                type: array
                items:
                  type: string
              slots:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    required:
