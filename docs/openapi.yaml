        tools:
          type: array
          items:
            $ref: '#/components/schemas/Tool'
          description: 本空间已启用意图引用到的工具（外部或平台内置），工具本身全平台通用
        space:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            bot:
              type: string
        slots:
          type: array
          description: 本空间的槽位定义
          items:
            type: object
            properties:
              name:
                type: string
              display_name:
                type: string
              type:
                type: string
              options:
                type: array
                items:
                  type: string
              default_ask:
                type: string
        validation_sets:
          type: array
          description: 所有 usage=validate 知识的完整内容，Bot 生成后必须逐条校验
          items:
            type: object
            properties:
              kb_id:
                type: string
              kb_name:
                type: string
              doc_id:
                type: string
              doc_name:
                type: string
              chunk_id:
                type: string
                description: '"*" 表示整篇文档'
              used_by:
                type: array
                items:
                  type: string
              items:
                type: array
                items:
                  type: object
                  properties:
                    chunk_id:
                      type: string
                    content:
                      type: string
                    cells:
                      type: object
                      additionalProperties:
                        type: string
                    tags:
                      $ref: '#/components/schemas/ScopeTags'
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: HEADER_MISMATCH
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        request_id:
          type: string
    Space:
      type: object
      required:
      - space_id
      - name
      - bot
      properties:
        space_id:
          type: string
          example: mc
        name:
          type: string
          example: Moonclaw 跨境智能体
        description:
          type: string
        bot:
          type: string
          description: 对应的 Bot / 智能体
          example: Moonclaw 智能体
        code_prefix:
          type: string
          example: M
    SlotDef:
      type: object
      required:
      - name
      - display_name
      - type
      - default_ask
