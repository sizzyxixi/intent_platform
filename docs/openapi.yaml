openapi: 3.0.3
info:
  title: 意图管理平台接口（平台内置工具；意图按空间，知识与工具全局）
  version: 0.20.1
  description: '本接口供 AI 工具以及各 Bot / 智能体（如 1688 智能客服、Moonclaw 跨境智能体）读写意图管理平台中的意图库、槽位与内嵌知识库。

    给 AI 的总规则：

    - 先选空间：GET /api/v1/spaces；之后意图类请求（taxonomy、slots、intents、runtime-config）带 X-Space-Id 请求头（或 space 查询参数），必须是 Key 绑定的空间之一（一个 Key 可绑定多个空间），否则 403 SPACE_FORBIDDEN。

    - 知识库（kbs、imports）与工具（tools）全平台通用，不区分空间，不需要 X-Space-Id。

    - 先读后写：写入前先调用 GET /api/v1/taxonomy、GET /api/v1/slots 与 GET /api/v1/intents 获取本空间分类、槽位与已有意图并查重。

    - 槽位按空间维护：优先复用本空间已有槽位，不要新建同义槽位。

    - 写意图用 POST /api/v1/intents:batchUpsert 且 mode=merge；写回默认是「草稿」。启用请用 POST /api/v1/intents/{code}:enable（须通过启用前校验）。分类不存在时先 POST /api/v1/taxonomy/nodes，或使用 auto_create_parents=true。

    - 不删除任何数据（分类与工具只能停用），不覆盖已启用意图。持有「意图:写」的 Key 可创建 / 更新 / 停用分类节点。

    - v0.6 起分类层级由各空间自行配置（0～5 层分类 + 最末层意图，如 1688 智能客服 = 阶段 / 意图，Moonclaw = 大类 / 问题桶 / 意图）：先读 GET /api/v1/taxonomy 的 levels 与 categories，写入时用 category_path 给出从第 1 层到最末层的完整路径（每段填编码或名称）。0.5 版的 l1 / l2 字段在写入与筛选时仍兼容，输出中已移除。

    - v0.5 起意图上不再有旧的 fallback 条件字段，写入时带 fallback / 转人工条件仍会被忽略。v0.19.3 起请用 handling 配置该意图的处理方式；用户一句话都匹配不上时，走空间设置 recognition.fallback。

    - 所有写请求都带 Idempotency-Key；单次最多 100 条；每个 Key 每分钟最多 60 次请求。

    - 工具类型：http（API 接口）/ mcp（MCP 工具）/ cli（CLI 命令）/ skill（技能）/ workflow（工作流）。持有「工具:写」的 Key 可通过 POST /api/v1/tools 按工具名幂等注册或更新（MCP 子工具须先登记服务再同步），用 POST /api/v1/tools/{name}:disable 停用；不能删除工具。绑定/解绑意图工具需要「意图:写」（绑定已有工具不需要「工具:写」）。平台仍然不替 Bot 执行业务工具。


    - v0.15 起：skill 为含 SKILL.md 的技能包（无入参，槽位作为上下文交给 AI，可用 GET /api/v1/tools/{name}/skill-package 下载）；workflow 对接 Dify / Coze / 通用 HTTP 工作流；MCP 服务鉴权改为凭据列表 mcp_server.credentials（位置 + 名称 + 环境变量名，不含密钥值），auth 字段保留兼容；槽位类型新增 文件 / 图片。

    - v0.6 起 MCP 按「服务 → 子工具」登记：子工具名为 {服务名}.{远端工具名}，Tool.server 为服务名，Tool.mcp_server 由 0.5 的 URL 字符串改为连接信息对象（URL 在 mcp_server.url）；runtime-config 新增 mcp_servers（只含被用到的服务，密钥只给环境变量名 auth.token_env）。

    - v0.20.1：工具增加可选业务分组 group（全类型通用）。POST/PUT /api/v1/tools、登记或更新 MCP 服务时可读写；CLI 原 config.group / cli.group 仍可用并与之同步。
    - v0.19.4：GET /api/v1/taxonomy、GET /api/v1/runtime-config 与 MCP list_intents（view=taxonomy）支持可选参数 max_depth（从起点算起返回几层，不传仍返回整棵树）和 parent（节点 id 或 code，从其子节点开始）。每个分类节点增加 has_children、child_count 与 id，便于按层下钻。
    - v0.19.3：意图增加处理方式 handling（tool_flow / handoff_human / fixed_reply / llm_free）。fixed_reply 可设 reply_strictness（paraphrase 按意思表达，默认；verbatim 完全固定）。非 tool_flow 不能绑定工具或知识。空间未匹配兜底与此同一套 mode，见 recognition.fallback（仍兼容 final_action）。
    - v0.20.5：分类节点 description 出现在 taxonomy / runtime-config / MCP / 意图 category_path；写入可按 id 更新无编码节点。空间对象增加 description；bot 为兼容字段。recognition 已废弃，fallback.mode 固定为 llm_free，PUT 忽略。
    - v0.20.3：固定话术的读取结果增加只读字段 handling.instruction（verbatim 必须原样输出、不得增删补充；paraphrase 可改写但不得改变原意）。verbatim 时使用方不得附加问候语或其他句子。
    - v0.19.2：知识库创建/编辑改为可选的自由文本「描述」，不再使用固化的适用范围字段（平台/站点/语言/类目）；旧标签已迁移进描述。
    - v0.19.1：给意图绑定或解绑已有工具只需「意图:写」，不再要求「工具:写」。
    - v0.19：开放接口允许维护型 AI 创建 / 更新 / 停用分类节点（「意图:写」），batchUpsert 支持 auto_create_parents，并可用 POST /api/v1/batchUpsert 一次性提交节点和意图（失败全部回滚）。另开放启用 / 停用意图、新建知识库、给意图关联知识。推荐 API 基址为 http://47.86.15.93/intent-platform（部分代理无法解析 sslip.io）。

    - v0.18：开放接口新增「工具:写」。AI 可注册 / 更新 / 停用工具，并把工具绑定到意图（含 param_map）；对应 MCP 工具为 register_tool、update_tool、disable_tool、intent_bind_tool、intent_unbind_tool。写入须带 Idempotency-Key（dry_run 除外）。控制台创建 API Key 时可授予「工具:写」。开放接口不能删除工具。

    - v0.17：工具中心已接入西之月 xclaw-cli（7037 条 CLI 命令 + 5 个技能，cli 配置带 auth_env / pack / group / risk_level）；cli / mcp / workflow 工具的 confirm_required=true 表示写操作，Bot 必须先取得用户（或客服）确认再执行。使用方见 docs/使用方接入指南.md，运营方见 docs/运营方配置手册.md；docs/AI使用说明.md 为索引。

    - 本接口自身也作为「平台内置」工具登记在工具中心（8 个能力，source=builtin）；其中写回意图、槽位写入/删除、导入知识为维护类，不能关联到意图，只给维护用 AI 通过 API Key 调用。

    '
servers:
- url: http://47.86.15.93/intent-platform
  description: 生产环境推荐（按 IP 访问，API 与 MCP）
- url: http://intent.47.86.15.93.sslip.io
  description: 控制台，以及备用 API 主机（部分代理无法解析 sslip.io 时请用上面的 IP 路径）
security:
- bearerAuth: []
tags:
- name: 空间
- name: 分类
- name: 槽位
- name: 意图
- name: 知识库
- name: 工具
- name: 导入任务
- name: 运行时
paths:
  /api/v1/spaces:
    get:
      tags:
      - 空间
      operationId: listSpaces
      summary: 业务空间列表
      description: '先调用它确认要读写的空间；返回当前 Key 可访问的空间（Key 绑定一个空间）。


        只返回当前 API Key 绑定的空间（一个 Key 可绑定一个或多个空间）。

        '
      responses:
        '200':
          description: 空间列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Space'
              example:
              - space_id: cs
                name: 1688 智能客服
                bot: Bot（吴钢）
                code_prefix: B
              - space_id: mc
                name: Moonclaw 跨境智能体
                bot: Moonclaw 智能体
                code_prefix: M
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/slots:
    get:
      tags:
      - 槽位
      operationId: listSlots
      summary: 读取当前空间的槽位列表
      description: '槽位按空间维护（由 X-Space-Id / space 决定），其他空间的槽位不可见。整理意图前先读，优先复用已有槽位。

        '
      parameters:
      - name: q
        in: query
        schema:
          type: string
        description: 匹配槽位名或显示名
      responses:
        '200':
          description: 槽位列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SlotDef'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
      - 槽位
      operationId: createSlot
      summary: 在当前空间新建槽位
      description: '仅在本空间确实没有合适槽位时使用；本空间已有同名槽位返回 409。

        '
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlotDef'
            example:
              name: color
              display_name: 颜色
              type: 枚举
              options:
              - 红
              - 黑
              - 白
              default_ask: 请问要什么颜色？
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotDef'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    parameters:
    - $ref: '#/components/parameters/SpaceHeader'
    - $ref: '#/components/parameters/SpaceQuery'
  /api/v1/slots/{name}:
    parameters:
    - $ref: '#/components/parameters/SpaceHeader'
    - $ref: '#/components/parameters/SpaceQuery'
    - name: name
      in: path
      required: true
      schema:
        type: string
    put:
      tags:
      - 槽位
      operationId: updateSlot
      summary: 修改当前空间的槽位
      description: '只能改显示名、类型、可选值和默认追问话术，英文名不可改。修改默认追问话术会影响本空间继承它的意图（MVP 不触发运行时配置 version 变化）。

        '
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlotUpdate'
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotDef'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags:
      - 槽位
      operationId: deleteSlot
      summary: 删除当前空间的槽位
      description: '槽位正被本空间意图使用时拒绝删除（409 SLOT_IN_USE，details.used_by 列出引用的意图编码），需先在这些意图中移除该槽位。给 AI 的说明：不要调用删除，除非运营明确要求。

        '
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: 已删除
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/taxonomy:
    get:
      tags:
      - 分类
      operationId: getTaxonomy
      summary: 读取意图分类（层级定义 + 分类树）
      description: '何时用：每次整理或写入意图之前先调用，拿到本空间的分类层级定义（levels）和分类树（categories）；写入意图时 category_path 必须是树上从第 1 层到最末层的一条完整路径。


        分类较多时请按层拉取，避免一次返回整棵树导致响应过大。max_depth 为从本轮起点算起最多返回几层（1～5）；不传则返回完整子树。parent 为起点节点的 id 或 code，传入后 categories 是该节点的子节点（不含自身），响应另含 parent 对象。每个节点带 id、description、has_children、child_count。请阅读 description 判断该往哪一支走，再据此判断是否继续下钻。推荐先 ?max_depth=1，再对需要展开的节点请求 ?parent={id 或 code}&max_depth=1。


        何时不用：不要用它来查具体意图，查意图用 GET /api/v1/intents。


        分类节点可由持有「意图:写」的 Key 通过 POST /api/v1/taxonomy/nodes 创建或更新；找不到合适分类时，先创建节点或使用 auto_create_parents。

        '
      responses:
        '200':
          description: 分类层级与分类树
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Taxonomy'
              example:
                levels:
                - depth: 1
                  name: 阶段
                intent_level_name: 意图
                categories:
                - code: PRE
                  name: 售前
                  depth: 1
                  id: 1
                  has_children: false
                  child_count: 0
                  children: []
                - code: MID
                  name: 售中
                  depth: 1
                  id: 2
                  has_children: false
                  child_count: 0
                  children: []
                - code: POST
                  name: 售后
                  depth: 1
                  id: 3
                  has_children: false
                  child_count: 0
                  children: []
                - code: NONE
                  name: 非询盘
                  depth: 1
                  id: 4
                  has_children: false
                  child_count: 0
                  children: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    parameters:
    - $ref: '#/components/parameters/SpaceHeader'
    - $ref: '#/components/parameters/SpaceQuery'
    - $ref: '#/components/parameters/TaxonomyMaxDepth'
    - $ref: '#/components/parameters/TaxonomyParent'

  /api/v1/taxonomy/nodes:
    post:
      tags: [分类]
      operationId: upsertTaxonomyNode
      summary: 按编码创建或更新分类节点
      description: 需要「意图:写」，Key 必须绑定该空间。code 为稳定编码。dry_run=true 只校验。不能删除分类，请用停用。
      parameters:
      - $ref: '#/components/parameters/SpaceHeader'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxonomyNodeInput'
      responses:
        '200':
          description: 更新成功，或 dry_run 校验通过
          content:
            application/json:
              schema:
                type: object
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxonomyNode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/taxonomy/nodes/{code}:disable:
    post:
      tags: [分类]
      operationId: disableTaxonomyNode
      summary: 停用分类节点（不删除）
      description: 子树中有已启用意图时返回 409 CATEGORY_IN_USE。
      parameters:
      - name: code
        in: path
        required: true
        schema: {type: string}
      - $ref: '#/components/parameters/SpaceHeader'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 已停用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxonomyNode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/taxonomy/nodes/{code}:
    put:
      tags: [分类]
      operationId: updateTaxonomyNode
      summary: 更新已有分类节点（路径为 code 或数字 id）
      parameters:
      - name: code
        in: path
        required: true
        schema: {type: string}
        description: 节点 code，或纯数字 id（无编码节点请用 id）
      - $ref: '#/components/parameters/SpaceHeader'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxonomyNodeInput'
      responses:
        '200':
          description: 更新成功或 dry_run
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/batchUpsert:
    post:
      tags: [意图]
      operationId: batchApplyCatalog
      summary: 一次性写入分类节点和意图（失败全部回滚）
      description: 需要「意图:写」。任一节点或意图失败则全部回滚，错误在 details.items。dry_run=true 只校验。
      parameters:
      - $ref: '#/components/parameters/SpaceHeader'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: 全部成功或 dry_run 预览
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/intents/{code}:enable:
    post:
      tags: [意图]
      operationId: enableIntent
      summary: 启用意图
      parameters:
      - name: code
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/IntentCode'
      - $ref: '#/components/parameters/SpaceHeader'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 已启用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Intent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/intents/{code}:disable:
    post:
      tags: [意图]
      operationId: disableIntentViaKey
      summary: 停用意图
      parameters:
      - name: code
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/IntentCode'
      - $ref: '#/components/parameters/SpaceHeader'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 已停用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Intent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
