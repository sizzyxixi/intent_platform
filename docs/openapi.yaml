                      阶段：售中

                      台账意图对照：售中询盘

                      必填槽位：order_id, target_price/qty

                      主工具(按序)：apply_change_price

                      辅工具：get_price_quote; lock_or_hold_stock

                      置信≥0.85：申请或改价结果+付款安排

                      置信0.60–0.85：clarify_slot(单号/改几)

                      低置信：handoff_human 超授权

                      禁止：未改先说已改好

                      备注：桶口径含转单信号，率偏高属预期

                      全量会话量：21124

                      文字转单率：1'
                    tags:
                      platform:
                      - '1688'
                      site: []
                      language:
                      - zh
                      category: []
                    cells:
                      备注: 桶口径含转单信号，率偏高属预期
                      意图: 售中改价改单
                      禁止: 未改先说已改好
                      阶段: 售中
                      低置信: handoff_human 超授权
                      辅工具: get_price_quote; lock_or_hold_stock
                      必填槽位: order_id, target_price/qty
                      置信≥0.85: 申请或改价结果+付款安排
                      全量会话量: '21124'
                      文字转单率: '1'
                      主工具(按序): apply_change_price
                      置信0.60–0.85: clarify_slot(单号/改几)
                      台账意图对照: 售中询盘
                mcp_servers: []
                tools:
                - name: xclaw_platform_alibaba_trade_order_modifyorderprice_call
                  display_name: 修改订单价格
                  type: cli
                  description: 修改订单价格
                  params:
                  - name: shop_id
                    type: string
                    required: true
                    description: ERP 店铺ID。PlatformDispatcher 会将该值传给 Alibaba 模块入口。
                  - name: order_id
                    type: number
                    required: true
                    description: 订单id
                  - name: carriage
                    type: number
                    required: true
                    description: 订单修改之后的运费，单位为分
                  - name: entry_discounts
                    type: string
                    required: true
                    description: 改价明细,discount值的单位为分，正数为涨价，负数为减价
                  source: external
                  input_schema:
                    type: object
                    properties:
                      shop_id:
                        type: string
                        description: ERP 店铺ID。PlatformDispatcher 会将该值传给 Alibaba 模块入口。
                      order_id:
                        type: number
                        description: 订单id
                      carriage:
                        type: number
                        description: 订单修改之后的运费，单位为分
                      entry_discounts:
                        type: string
                        description: 改价明细,discount值的单位为分，正数为涨价，负数为减价
                    required:
                    - shop_id
                    - order_id
                    - carriage
                    - entry_discounts
                  cli:
                    bin: xclaw-cli
                    command_template: xclaw-cli platform alibaba trade-order-modifyorderprice call --shop-id {shop_id} --order-id {order_id} --carriage {carriage} --entry-discounts {entry_discounts} --json
                    auth: CLI 内置登录（OAuth）
                    login_command: xclaw-cli auth login
                    install: curl -fsSL https://open.westmonth.com/install | bash（Windows：irm https://open.westmonth.com/install.ps1 | iex）
                    verified_version: 2.2.10
                    output_format: json
                    confirm_required: true
                    output_description: JSON（--json）；参数与返回以 xclaw-cli schema platform alibaba trade-order-modifyorderprice call --json 为准
                    auth_env: XCLAW_UMC_TOKEN
                    pack: platform
                    pack_name: 第三方跨境平台 OpenAPI 转发，包含商品、订单、物流、库存、营销、店铺等能力
                    group: alibaba
                    source_ref: platform.alibaba.trade-order-modifyorderprice.call
                    risk_level: low
                  confirm_required: true
        '304':
          description: since_version 与当前版本相同，配置无变化
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    parameters:
    - $ref: '#/components/parameters/SpaceHeader'
    - $ref: '#/components/parameters/SpaceQuery'
  /api/v1/recognition:
    parameters:
    - $ref: '#/components/parameters/SpaceHeader'
    - $ref: '#/components/parameters/SpaceQuery'
    get:
      tags:
      - 运行时
      operationId: getRecognition
      summary: 读取当前空间的空间设置
      description: '何时用：Bot 想单独确认识别阈值、澄清和最终动作时；运行时配置里的 recognition 与本接口一致。

        '
      responses:
        '200':
          description: 空间设置
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Recognition'
                - type: object
                  properties:
                    version:
                      type: integer
                      description: 当前空间配置版本
              example:
                threshold: 0.6
                candidate_min: 0.3
                max_candidates: 3
                max_clarify: 2
                max_slot_ask: 2
                tool_retry: 1
                final_action: general_assistant
                final_action_label: 交给通用助手
                clarify_prompt: 我想确认一下，您是想要以下哪一项？
                final_message: null
                version: 8
        '401': *id001
        '403': *id002
        '404': *id003
        '429': *id004
    put:
      tags:
      - 运行时
      operationId: updateRecognition
      summary: 更新当前空间的空间设置（配置版本 +1）
      description: '何时用：运营或维护用 AI 调整识别阈值、澄清 / 追问次数、工具重试或最终动作。维护类接口，需「意图:写」权限。

        给 AI 的规则：未经运营明确要求不要调用；有改动时当前空间配置版本 +1，无改动不升版本。

        '
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecognitionUpdate'
            example:
              threshold: 0.55
              max_clarify: 1
      responses:
        '200':
          description: 更新后的空间设置
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Recognition'
                - type: object
                  properties:
                    version:
                      type: integer
                      description: 当前空间配置版本
              example:
                threshold: 0.55
                candidate_min: 0.28
                max_candidates: 3
                max_clarify: 1
                max_slot_ask: 2
                tool_retry: 1
                final_action: general_assistant
                final_action_label: 交给通用助手
                clarify_prompt: 我想确认一下，您是想要以下哪一项？
                final_message: null
                version: 9
        '401': *id001
        '403': *id002
        '404': *id003
        '429': *id004
        '422':
          $ref: '#/components/responses/Unprocessable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 在平台「工具中心 › 接入与密钥」页创建的 API Key，形如 ipk_xxx。Key 可绑定一个或多个空间（只约束意图类接口）；知识与工具接口对所有 Key 全局可用（仍受知识/工具权限控制）。
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 写请求必填。同一 Key 24 小时内重复提交返回首次结果，不会重复写入。重试时必须复用同一个值。
      schema:
        type: string
        maxLength: 64
        example: 7f3a-20261110-0001
    KbId:
      name: kb_id
      in: path
      required: true
      schema:
        type: string
        example: kb_cs_reply
    SpaceHeader:
      name: X-Space-Id
      in: header
      required: false
      schema:
        type: string
        example: mc
      description: 业务空间 ID（如 cs、mc），只用于意图类接口（taxonomy、slots、intents、runtime-config）。与 query 参数 space 二选一；都不传时使用 API Key 绑定的第一个空间；不在 Key 绑定的空间内返回 403 SPACE_FORBIDDEN。
    SpaceQuery:
      name: space
      in: query
      required: false
      schema:
        type: string
        example: mc
      description: 业务空间 ID，等同于 X-Space-Id 请求头。
    TaxonomyMaxDepth:
      name: max_depth
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 5
      description: 从本轮起点算起最多返回几层分类（1～5）。不传则返回完整子树。例如 max_depth=1 只返回起点下的直接子节点（从根开始即第一层）。
    TaxonomyParent:
      name: parent
      in: query
      required: false
      schema:
        type: string
      description: 起点节点的 id 或 code。传入后 categories 为该节点的子节点（不含自身），响应另含 parent 对象。不传则从根开始。节点不存在时返回 404 CATEGORY_NOT_FOUND。
  responses:
    BadRequest:
      description: 参数或文件格式错误（如表头不一致、扩展名不支持、编码格式错误）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: HEADER_MISMATCH
            message: 表头与知识库不一致
            details:
              expected:
              - 问题
              - 答案
              - 意图编码
              - 适用范围
              actual:
              - question
              - answer
    Unauthorized:
      description: 未携带或携带了无效/已吊销的 API Key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Key 无此权限，或操作被平台规则禁止（如启用意图、修改已启用意图）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 意图、知识库、文档或切片不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 冲突（同名/同内容文档需确认覆盖、编码或名称冲突、Idempotency-Key 被不同请求体复用）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: OVERWRITE_REQUIRED
            message: 与已有文档同名，覆盖会影响 1 个已关联意图
            details:
              affected_intents:
              - B.PRE.STOCK
    PayloadTooLarge:
      description: 单次超过 100 条或文件过大
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: 内容校验不通过（例句不足 3 条、必填槽位缺追问话术、分类路径不存在等）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: 超过每分钟 60 次限制
      headers:
        Retry-After:
          schema:
            type: integer
          description: 建议等待的秒数
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    IntentCode:
      type: string
      pattern: ^[A-Z]{1,4}(\.[A-Z0-9_]+){1,6}$
      example: M.DESIGN.MAIN
      description: 编码规则 {空间前缀}.{第一层分类编码}.{意图英文}，全大写，下划线分隔，全局唯一，创建后不可改；第一层分类没有编码（或空间没有分类层）时为 {空间前缀}.{意图英文…}。1688 智能客服前缀 B，Moonclaw 前缀 M。
    IntentStatus:
      type: string
      enum:
      - 草稿
      - 启用
      - 停用
    Slot:
      type: object
      required:
      - name
      - required
      properties:
        name:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
          example: sku
          description: 必须是本空间槽位列表中的槽位名
        required:
          type: boolean
          example: true
        ask:
          type: string
          description: 本意图的追问话术；留空则继承该槽位的 default_ask
          example: 请问是哪一款？
    KbRef:
      type: object
      required:
      - kb_id
      - doc_id
      - chunk_id
      - usage
      properties:
        kb_id:
          type: string
          example: kb_spec
        doc_id:
          type: string
          example: P1
        chunk_id:
          type: string
          example: P1-3
          description: '"*" 表示整篇文档'
        usage:
          type: string
          enum:
          - reference
          - validate
          description: reference=参考（检索后用于回答/生成）；validate=校验（生成后比对，硬约束）

    ToolUpsert:
      type: object
      required:
      - name
      - type
      - display_name
      - description
      - owner
      properties:
        name:
          type: string
          description: 稳定编码，小写字母开头，仅小写字母 / 数字 / 下划线，最长 120
        type:
          type: string
          enum:
          - http
          - cli
          - skill
          - workflow
          - mcp
        display_name:
          type: string
        description:
          type: string
        owner:
          type: string
        group:
          type: string
          maxLength: 200
          description: 可选。业务分组，用于目录分类与筛选。可使用已有分组名，也可填写新名称。空字符串表示清除。CLI 工具会同步到 cli.group。
        params:
          type: array
          items:
            type: object
        config:
          type: object
        dry_run:
          type: boolean
          description: true 时只校验不写入
        secret:
          type: string
          description: HTTP 密钥，仅写入，不会在响应中返回
    ToolWrite:
      allOf:
      - $ref: '#/components/schemas/Tool'
      - type: object
        required:
        - action
        properties:
          action:
            type: string
            enum:
            - created
            - updated
            - disabled
          warnings:
            type: array
            items:
              type: string
    DryRunTool:
      type: object
      required:
      - ok
      - dry_run
      - action
      - name
      properties:
        ok:
          type: boolean
        dry_run:
          type: boolean
        action:
          type: string
          enum:
          - created
          - updated
        name:
          type: string
    DryRunBind:
      type: object
      required:
      - ok
      - dry_run
      - code
      - bind
      properties:
        ok:
          type: boolean
        dry_run:
          type: boolean
        code:
          type: string
        bind:
          $ref: '#/components/schemas/ToolBind'
    ToolBindInput:
      type: object
      required:
      - tool
      properties:
        tool:
          type: string
        param_map:
          type: object
          additionalProperties:
            type: object
            properties:
              source:
                type: string
              value:
                type: string
        dry_run:
          type: boolean
    ToolBind:
      type: object
      required:
      - tool
      - param_map
      properties:
        tool:
          type: string
          example: xclaw_platform_alibaba_product_get
        param_map:
          type: object
          additionalProperties:
            type: object
            required:
            - source
            - value
            properties:
              source:
                type: string
                enum:
                - 槽位
                - 常量
                - 上下文
              value:
                type: string
                example: sku
        server:
          type: string
          description: type=mcp 时（运行时配置）所属 MCP 服务名
        mcp_tool:
          type: string
          description: type=mcp 时（运行时配置）远端工具名
    Handling:
      type: object
      description: |
        意图处理方式。mode=tool_flow 为默认，走槽位/知识/工具流程；其余三种不能绑定工具或知识。
        空间未匹配兜底见 Recognition.fallback，mode 不含 tool_flow。
      required: [mode]
      properties:
        mode:
          type: string
          enum: [tool_flow, handoff_human, fixed_reply, llm_free]
        mode_label:
          type: string
          readOnly: true
        message:
          type: string
          maxLength: 2000
          description: 转人工说明，可选
        replies:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            maxLength: 2000
          description: 固定话术，至少 1 条
        reply_strictness:
          type: string
          enum: [paraphrase, verbatim]
          default: paraphrase
          description: |
            paraphrase=按意思表达（可改写须保原意，默认）；
            verbatim=完全固定（必须原样输出其中一条话术，不得改写、增删或补充，也不要附加问候语或其他句子）。
        reply_strictness_label:
          type: string
          readOnly: true
        instruction:
          type: string
          readOnly: true
          description: |
            仅 fixed_reply 时返回，给使用方智能体的短指令，不落库。
            paraphrase：「按话术意思表达，可改写措辞但不得改变原意」；
            verbatim：「必须原样输出其中一条话术，不得改写、增删或补充」。
        prompt:
          type: string
          maxLength: 2000
          description: 让 AI 自由发挥时的说明或边界，可选
    Fallback:
      allOf:
      - $ref: '#/components/schemas/Handling'
      - type: object
        description: 空间未匹配/低置信度兜底，mode 仅为 handoff_human / fixed_reply / llm_free
        properties:
          mode:
            type: string
            enum: [handoff_human, fixed_reply, llm_free]
    IntentSummary:
      type: object
      required:
      - code
      - name
      - category_path
      - status
      - updated_at
      properties:
        code:
          $ref: '#/components/schemas/IntentCode'
        name:
          type: string
          example: 现货/有货确认
        category_path:
          $ref: '#/components/schemas/CategoryPath'
        description:
          type: string
          description: 意图描述
        handling:
          $ref: '#/components/schemas/Handling'
        status:
          $ref: '#/components/schemas/IntentStatus'
        example_count:
          type: integer
          example: 5
        updated_at:
          type: string
          format: date-time
        space:
          type: string
          example: mc
    Intent:
      allOf:
      - $ref: '#/components/schemas/IntentSummary'
      - type: object
        properties:
          examples:
            type: array
            items:
              type: string
          slots:
            type: array
            items:
              $ref: '#/components/schemas/Slot'
          kb_refs:
            type: array
            items:
              $ref: '#/components/schemas/KbRef'
          tools:
            type: array
            items:
              $ref: '#/components/schemas/ToolBind'
    IntentInput:
      type: object
      required:
      - code
      - name
      - description
      - examples
      properties:
        code:
          $ref: '#/components/schemas/IntentCode'
        name:
          type: string
          maxLength: 30
        category_path:
          type: array
          items:
            type: string
          description: 从第 1 层到最末层分类的完整路径，每段填该层的编码或名称（如 ["STOCK", "现货"]）；层数必须等于 taxonomy.levels 的长度。空间有分类层时必填（或用兼容字段 l1/l2）
          example:
          - STOCK
          - 现货
        l1:
          type: string
          deprecated: true
          description: 0.5 版字段（兼容）：等价于 category_path 第 1 段
        l2:
          type: string
          deprecated: true
          description: 0.5 版字段（兼容）：等价于 category_path 第 2 段
        description:
          type: string
          minLength: 15
          description: 意图描述。这段描述会被大模型分类和语义匹配使用，至少 15 个字。请写清：用户想做什么；什么情况算这个意图；什么情况不算（容易和哪个意图混淆）。示例：用户想为商品生成符合平台规范的主图；"做主图""首图"算；只要换白底不算（→ M.DESIGN.WHITE_BG）
        examples:
          type: array
          minItems: 3
          items:
            type: string
          description: 用户原话风格的例句，至少 3 条，不要重复
        slots:
          type: array
          items:
            $ref: '#/components/schemas/Slot'
        handling:
          $ref: '#/components/schemas/Handling'
    IntentPatch:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          minLength: 15
          description: 意图描述，写作要求同 IntentInput.description
        examples:
          type: array
          items:
            type: string
        slots:
          type: array
          items:
            $ref: '#/components/schemas/Slot'
        handling:
          $ref: '#/components/schemas/Handling'
        status:
          type: string
          enum:
          - 草稿
          - 停用
          description: AI 不得设为「启用」
    BatchUpsertRequest:
      type: object
      required:
      - mode
      - intents
      properties:
        mode:
          type: string
          enum:
          - merge
          - overwrite
          default: merge
          description: AI 一律使用 merge
        intents:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/IntentInput'
        auto_create_parents:
          type: boolean
          default: false
          description: true 时自动创建 category_path 中缺失的分类节点（每段须为编码，或 {code,name}）
    BatchUpsertResult:
      type: object
      required:
      - created
      - updated
      - skipped
      - items
      - conflicts
      - import_id
      properties:
        created:
          type: integer
        updated:
          type: integer
        skipped:
          type: integer
        items:
          type: array
          items:
            type: object
            required:
            - code
            - result
            - status
            properties:
              code:
                type: string
              result:
                type: string
                enum:
                - created
                - merged
                - overwritten
                - unchanged
              status:
                $ref: '#/components/schemas/IntentStatus'
        conflicts:
          type: array
          items:
            type: object
            required:
            - code
            - reason
            - message
            properties:
              code:
                type: string
              reason:
                type: string
                enum:
                - INVALID_CODE
                - MISSING_FIELD
                - DESCRIPTION_TOO_SHORT
                - UNKNOWN_CATEGORY
                - DUPLICATE_IN_BATCH
                - DUPLICATE_NAME
                - TOO_FEW_EXAMPLES
                - SLOT_ASK_MISSING
                - ENABLED_PROTECTED
                - CODE_IN_OTHER_SPACE
              message:
                type: string
        import_id:
          type: string
        space:
          type: string
        new_slots:
          type: array
          items:
            type: string
          description: 本次在当前空间自动新建的槽位（槽位名在本空间不存在时自动创建为文本槽位），请提醒运营补全显示名和追问话术
        ignored_fields:
          type: array
          description: 被忽略的字段（如已取消的 fallback），不影响写入
          items:
            type: object
            properties:
              code:
                type: string
              fields:
                type: array
                items:
                  type: string
                example:
                - fallback
    KnowledgeBase:
      type: object
      required:
      - kb_id
      - name
      - type
      - status
      - updated_at
      - created_at
      properties:
        kb_id:
          type: string
          example: kb_cs_reply
        name:
          type: string
          example: 1688客服-回复规则与禁止项
        type:
          type: string
          enum:
          - 表格知识库
          - 图文知识库-富文本
        status:
          type: string
          enum:
          - 构建中
          - 构建成功
          - 构建失败
        headers:
          type: array
          items:
            type: string
          description: 仅表格知识库；导入文件表头必须与之完全一致
          example:
          - 问题
          - 答案
          - 意图编码
          - 适用范围
        updated_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        description:
          type: string
          maxLength: 2000
          description: 可选。自由文本，说明这份知识是做什么用的。
      description: 知识库全平台通用，不区分业务空间；用 description 说明用途。不再使用固化的适用范围字段。
    Document:
      type: object
      required:
      - doc_id
      - name
      - status
      - data_size
      - uploaded_at
      - updated_at
      properties:
        doc_id:
          type: string
          example: A1
        name:
          type: string
          example: 现货与库存.xlsx
        status:
          type: string
          enum:
          - 构建中
          - 构建成功
          - 构建失败
        data_size:
          type: string
          example: 4 条
        uploaded_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Chunk:
      type: object
      required:
      - chunk_id
      - doc_id
      - order
      - content
      - updated_at
      properties:
        chunk_id:
          type: string
          example: Q1
        doc_id:
          type: string
          example: A1
        order:
          type: integer
          example: 1
        content:
          type: string
          example: '问题：有现货吗

            答案：仓库现货约 2,360 件'
        cells:
          type: object
          additionalProperties:
            type: string
          description: 仅表格知识库
        linked_intents:
          type: array
          items:
            type: string
          example:
          - B.PRE.STOCK
        updated_at:
          type: string
          format: date-time
        tags:
          allOf:
          - $ref: '#/components/schemas/ScopeTags'
          description: 切片自身标签
        effective_tags:
          allOf:
          - $ref: '#/components/schemas/ScopeTags'
          description: 生效标签：切片未设置的类别继承知识库标签；为空表示不限
          readOnly: true
    ChunkUpdate:
      type: object
      properties:
        content:
          type: string
          description: 图文知识库使用
        cells:
          type: object
          additionalProperties:
            type: string
          description: 表格知识库使用，键必须与表头一致
        tags:
          $ref: '#/components/schemas/ScopeTags'
    SearchHit:
      type: object
      required:
      - chunk
      - doc_name
      - score
      properties:
        score:
          type: number
          minimum: 0
          maximum: 1
          example: 0.82
        doc_name:
          type: string
        chunk:
          $ref: '#/components/schemas/Chunk'
    ImportTask:
      type: object
      required:
      - import_id
      - status
      properties:
        import_id:
          type: string
        status:
          type: string
          enum:
          - 构建中
          - 构建成功
          - 构建失败
        documents:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              action:
                type: string
                enum:
                - created
                - overwritten
        affected_intents:
          type: array
          items:
            type: string
        message:
          type: string
    Tool:
      type: object
      required:
      - name
      - display_name
      - type
      - description
      - params
      - source
      properties:
        name:
          type: string
          example: xclaw_platform_alibaba_product_get
        display_name:
          type: string
          example: 获取商品
        description:
          type: string
        group:
          type: string
          nullable: true
          maxLength: 200
          description: 业务分组。未设置时为 null。CLI 工具的 cli.group 与此相同。
        method:
          type: string
          enum:
          - GET
          - POST
          - PUT
          - DELETE
          description: type=http
        params:
          type: array
          items:
            type: object
            required:
            - name
            - type
            - required
            properties:
              name:
                type: string
              type:
                type: string
                enum:
                - string
                - number
                - boolean
                - file
                - file_list
                - string[]
                description: file / file_list 为文件链接（意图里只能映射到「文件 / 图片」类型的槽位）；string[] 为字符串数组
              required:
                type: boolean
              description:
                type: string
              default:
                type: string
                description: 默认值（workflow 必填入参有默认值时可不映射）
        type:
          type: string
          enum:
          - http
          - mcp
          - cli
          - skill
          - workflow
          description: http=API 接口（HTTP）；mcp=MCP 工具（某个 MCP 服务的子工具）；cli=CLI 命令；skill=技能（含 SKILL.md 的技能包，无入参）；workflow=工作流（Dify / Coze / 通用 HTTP）。平台只登记，执行在 Bot。
        server:
          type: string
          nullable: true
          example: compliance
          description: type=mcp，所属 MCP 服务名
        url:
          type: string
          description: type=http
        mcp_server:
          $ref: '#/components/schemas/McpServerConn'
        mcp_tool:
          type: string
          description: type=mcp，远端 MCP 服务里的原始工具名（tools/call 的 name）
        input_schema:
          type: object
          description: type=mcp 时为远端 inputSchema；http / cli / workflow 由 params 生成（file 为 format=uri、x-type=file）。skill 没有 input_schema。
        auth:
          type: string
          enum:
          - 无
          - API Key
          - Bearer Token
          - OAuth2
          description: type=http，鉴权方式；密钥由平台托管，不在接口中返回
        cli:
          type: object
          description: type=cli 时返回
          required:
          - bin
          - command_template
          properties:
            bin:
              type: string
              example: xclaw-cli
              description: 可执行程序名
            command_template:
              type: string
              example: xclaw-cli mall mall-product rank-list query --delivery-region-id {delivery_region_id} --nums {nums} --json
              description: 命令 / 子命令模板，{参数名} 引用入参；选填参数为空时连同其前面的 --选项 一起省略
            auth:
              type: string
              enum:
              - 无
              - CLI 内置登录（OAuth）
              - 环境变量 Token
              description: 所需鉴权
            auth_env:
              type: string
              example: XCLAW_UMC_TOKEN
              description: 可选。Bot 运行环境可用该环境变量注入 Token 代替交互式登录（只给变量名，不含值）
            pack:
              type: string
              example: mall
              description: 可选。按官方命令目录批量接入时的命令包编码
            pack_name:
              type: string
              example: 商城解决方案
            group:
              type: string
              example: mall-product
              description: 可选。命令包下的业务分组
            source_ref:
              type: string
              example: mall.mall-product.rank-list.query
              description: 可选。来源命令 ID（官方目录里的 operationId）
            risk_level:
              type: string
              description: 可选。来源标注的风险等级（low / medium / high）
            login_command:
              type: string
              example: xclaw-cli auth login
              description: Bot 运行环境首次使用或 Token 过期时执行的登录命令
            install:
              type: string
              example: curl -fsSL https://open.westmonth.com/install | bash
              description: 所需环境 / 安装方式
            verified_version:
              type: string
              example: 2.2.10
              description: 登记时验证过的 CLI 版本
            output_format:
              type: string
              enum:
              - json
              - text
            confirm_required:
              type: boolean
              description: 写操作，Bot 执行前需用户确认
            output_description:
              type: string
        source:
          type: string
          enum:
          - external
          - builtin
          description: external=技术注册的外部工具；builtin=平台内置工具（本平台自己的接口，不可编辑/删除）
        maintenance:
          type: boolean
          description: source=builtin 时返回；true=维护类（写回意图、槽位写入/删除、导入知识），不能关联到意图
        space_scoped:
          type: boolean
          description: source=builtin 时返回；true=调用时需带 X-Space-Id
        endpoints:
          type: array
          items:
            type: string
          description: source=builtin 时返回，该能力合并的 REST 接口
          example:
          - POST /api/v1/kbs/{kb_id}/search
        mcp_tools:
          type: array
          items:
            type: string
          description: source=builtin 时返回，对应的 MCP 工具
          example:
          - search_knowledge
        confirm_required:
          type: boolean
          description: 写操作需确认：Bot 调用前须向用户确认（mcp / cli / workflow）
        enabled:
          type: boolean
          description: 是否启用。停用后不再出现在运行时配置中，也不能新绑定到意图。开放接口只能停用，不能删除。
        remote_missing:
          type: boolean
          description: type=mcp，最近一次同步时远端已不存在但仍被意图使用（标红待处理）
        skill:
          type: object
          description: type=skill 时返回。技能没有入参映射：本意图抽取的槽位作为上下文交给 AI，输出格式写在意图的回复要求里
          required:
          - name
          - version
          - description
          - files
          properties:
            name:
              type: string
              description: SKILL.md 前置元数据 name
            version:
              type: integer
              description: 技能包版本，每次重新上传 +1
            description:
              type: string
              description: SKILL.md 前置元数据 description（工具描述与之一致，只读）
            files:
              type: array
              items:
                type: object
                required:
                - path
                - size
                properties:
                  path:
                    type: string
                    example: scripts/generate.py
                  size:
                    type: integer
            download_path:
              type: string
              nullable: true
              example: /api/v1/tools/xclaw_platform/skill-package
              description: 技能包 zip 下载地址（需 工具:读 权限）
        workflow:
          type: object
          description: type=workflow 时返回（不含任何密钥值）
          required:
          - platform
          - response_mode
          - output_mapping
          - confirm_required
          properties:
            platform:
              type: string
              enum:
              - dify
              - coze
              - generic
            response_mode:
              type: string
              enum:
              - blocking
              - streaming
            auth_env:
              type: string
              nullable: true
              example: DIFY_APP_KEY
              description: Bot 侧保存密钥的环境变量名
            timeout_sec:
              type: number
              description: 可选，超时秒数；不给则用 Bot 默认
            confirm_required:
              type: boolean
            output_mapping:
              type: array
              items:
                type: object
                required:
                - from
                - as
                properties:
                  from:
                    type: string
                    example: data.outputs.result
                  as:
                    type: string
                    example: result
            base_url:
              type: string
              example: https://api.dify.ai/v1
              description: platform=dify；POST {base_url}/workflows/run
            user:
              type: object
              description: platform=dify；mode=constant 时 value 为固定 user，mode=session 时用会话用户
              properties:
                mode:
                  type: string
                  enum:
                  - constant
                  - session
                value:
                  type: string
            region:
              type: string
              enum:
              - coze.cn
              - coze.com
              description: platform=coze
            workflow_id:
              type: string
              description: platform=coze
            workflow_version:
              type: string
              description: platform=coze，可选
            is_async:
              type: boolean
              description: platform=coze，异步运行（Bot 需轮询结果）
            bot_id:
              type: string
            app_id:
              type: string
            ext:
              type: object
              description: platform=coze，可选
            url:
              type: string
              description: platform=generic
            method:
              type: string
              enum:
              - POST
              - GET
              - PUT
              description: platform=generic
            auth:
              type: string
              enum:
              - 无
              - API Key
              - Bearer Token
              description: platform=generic
            output_description:
              type: string
      description: 工具目录（外部工具 + 平台内置工具）。
    RuntimeConfig:
      type: object
      required:
      - space
      - version
      - generated_at
      - recognition
      - taxonomy
      - slots
      - intents
      - validation_sets
      - tools
      properties:
        version:
