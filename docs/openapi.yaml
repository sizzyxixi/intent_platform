    Recognition:
      type: object
      description: 空间设置（每个空间一份）：识别阈值、澄清、槽位追问、工具失败重试与最终动作。替代原意图级 fallback。
      required:
      - threshold
      - candidate_min
      - max_candidates
      - max_clarify
      - max_slot_ask
      - tool_retry
      - final_action
      - clarify_prompt
      properties:
        threshold:
          type: number
          minimum: 0
          maximum: 1
          example: 0.6
          description: 识别阈值，Top1 置信度 ≥ 阈值算命中。数值含义由 Bot 的识别模型决定，建议用单句测试和实际对话校准
        candidate_min:
          type: number
          minimum: 0
          maximum: 1
          example: 0.3
          description: 澄清候选下限，等于 threshold ÷ 2（只读，由平台计算）
        max_candidates:
          type: integer
          example: 3
          description: 澄清时最多列出的候选数
        max_clarify:
          type: integer
          minimum: 0
          maximum: 5
          example: 2
          description: 澄清最多次数，超过执行 final_action
        max_slot_ask:
          type: integer
          minimum: 0
          maximum: 5
          example: 2
          description: 每个必填槽位最多追问次数，超过执行 final_action
        tool_retry:
          type: integer
          minimum: 0
          maximum: 3
          example: 1
          description: 工具调用失败后的重试次数，仍失败执行 final_action
        final_action:
          type: string
          enum:
          - handoff_human
          - general_assistant
          - decline
          example: general_assistant
          description: handoff_human=转人工；general_assistant=交给通用助手；decline=告知无法处理（回复 final_message）
        final_action_label:
          type: string
          example: 交给通用助手
        clarify_prompt:
          type: string
          example: 我想确认一下，您是想要以下哪一项？
        final_message:
          type: string
          nullable: true
          description: final_action=decline 时回复的话术，其余为 null
    RecognitionUpdate:
      type: object
      description: 更新空间设置；只传要改的字段。candidate_min 由平台按 threshold ÷ 2 计算，不可写。
      properties:
        threshold:
          type: number
          minimum: 0
          maximum: 1
          example: 0.6
          description: 识别阈值，Top1 置信度 ≥ 阈值算命中。数值含义由 Bot 的识别模型决定，建议用单句测试和实际对话校准
        max_clarify:
          type: integer
          minimum: 0
          maximum: 5
          example: 2
          description: 澄清最多次数，超过执行 final_action
        max_slot_ask:
          type: integer
          minimum: 0
          maximum: 5
          example: 2
          description: 每个必填槽位最多追问次数，超过执行 final_action
        tool_retry:
          type: integer
          minimum: 0
          maximum: 3
          example: 1
          description: 工具调用失败后的重试次数，仍失败执行 final_action
        final_action:
          type: string
          enum:
          - handoff_human
          - general_assistant
          - decline
          example: general_assistant
          description: handoff_human=转人工；general_assistant=交给通用助手；decline=告知无法处理（回复 final_message）
        clarify_prompt:
          type: string
          example: 我想确认一下，您是想要以下哪一项？
        final_message:
          type: string
          nullable: true
          description: final_action=decline 时回复的话术，其余为 null
    CategoryRef:
      type: object
      required:
      - code
      - name
      properties:
        code:
          type: string
          nullable: true
          description: 分类编码；只有部分层级（通常是第一层）有编码
          example: STOCK
        name:
          type: string
          example: 库存与货期
    CategoryPath:
      type: array
      description: 从第 1 层到最末层分类的路径；空间没有分类层时为空数组
      items:
        $ref: '#/components/schemas/CategoryRef'
      example:
      - code: STOCK
        name: 库存与货期
      - code: null
        name: 现货
    CategoryNode:
      type: object
      required:
      - code
      - name
      - depth
      - children
      properties:
        code:
          type: string
          nullable: true
        name:
          type: string
        depth:
          type: integer
          minimum: 1
        children:
          type: array
          items:
            $ref: '#/components/schemas/CategoryNode'
    TaxonomyLevels:
      type: object
      required:
      - levels
      - intent_level_name
      properties:
        levels:
          type: array
          description: 分类层级定义（不含意图层），按 depth 排序；0～5 个
          items:
            type: object
            required:
            - depth
            - name
            properties:
              depth:
                type: integer
              name:
                type: string
          example:
          - depth: 1
            name: 大类
          - depth: 2
            name: 问题桶
        intent_level_name:
          type: string
          example: 意图
          description: 最末层（意图层）的显示名称
    Taxonomy:
      allOf:
      - $ref: '#/components/schemas/TaxonomyLevels'
      - type: object
        required:
        - categories
        properties:
          categories:
            type: array
            items:
              $ref: '#/components/schemas/CategoryNode'
