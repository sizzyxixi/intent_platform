        $ref: '#/components/schemas/IntentCode'
    get:
      tags:
      - 意图
      operationId: getIntent
      summary: 读取意图详情
      description: '何时用：需要完整的例句、槽位、关联知识切片、工具入参映射时。

        何时不用：批量浏览用列表接口，避免逐条请求触发限流。

        '
      responses:
        '200':
          description: 意图详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Intent'
        '401': &id001
          $ref: '#/components/responses/Unauthorized'
        '403': &id002
          $ref: '#/components/responses/Forbidden'
        '404': &id003
          $ref: '#/components/responses/NotFound'
        '429': &id004
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags:
      - 意图
      operationId: patchIntent
      summary: 修改单个草稿意图
      description: '何时用：只改一个草稿意图的少量字段（如补例句、补追问话术）。

        何时不用：批量写入用 batchUpsert；不要用它修改已启用意图，也不要把 status 改为「启用」（启用由运营在平台上完成，AI 调用会返回 403）。

        '
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntentPatch'
            example:
              examples:
              - 没货能先拍吗
              - 可以预定吗
              - 预售什么时候发
      responses:
        '200':
          description: 修改后的意图
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Intent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/intents:batchUpsert:
    post:
      tags:
      - 意图
      operationId: batchUpsertIntents
      summary: 批量写入意图（AI 写回的主入口）
      description: '何时用：AI 整理好一批意图后写回平台。编码不存在则新建为草稿；编码已存在则按 mode 处理。

        给 AI 的规则：

        - mode 一律用 merge（只补充新例句、新槽位，不改已有非空字段）。

        - 已启用意图只允许 merge；mode=overwrite 作用于已启用意图会被跳过并在 conflicts 中返回 ENABLED_PROTECTED。

        - 单次最多 100 条，超出返回 413；按结果中的 conflicts 逐条修正后重试，不要整批重复提交。

        何时不用：不要用它删除意图或修改状态；不要用它新建分类。

        - fallback（兜底条件）字段已取消：传入不会报错，但会被忽略，并在结果 ignored_fields 中列出。

        '
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchUpsertRequest'
            example:
              mode: merge
              intents:
              - code: B.PRE.PAYMENT
                name: 付款方式咨询（示例）
                category_path:
                - PRE
                description: 示例：买家询问支持哪些付款方式；问「能用信用卡吗」算；已下单问改价不算（→ B.MID.CHANGE_ORDER）
                examples:
                - 支持什么付款方式
                - 可以用信用卡付吗
                - 能先发货后付款吗
                slots:
                - name: offer_id
                  required: false
      responses:
        '200':
          description: 写入结果（部分成功也返回 200，失败项在 conflicts 中）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchUpsertResult'
              example:
                created: 1
                updated: 0
                skipped: 1
                items:
                - code: B.PRE.PAYMENT
                  result: created
                  status: 草稿
                conflicts:
                - code: B.BAD
                  reason: UNKNOWN_CATEGORY
                  message: 分类「XX」不存在（第一层：阶段）
                import_id: IMP-1008
                space: cs
                new_slots: []
                ignored_fields: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    parameters:
    - $ref: '#/components/parameters/SpaceHeader'
    - $ref: '#/components/parameters/SpaceQuery'
