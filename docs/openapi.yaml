    Tool:
      type: object
      required:
      - name
      - display_name
      - type
      - description
      - params
      - source
      properties:
        name:
          type: string
          example: query_stock
        display_name:
          type: string
          example: 查库存
        description:
          type: string
        method:
          type: string
          enum:
          - GET
          - POST
          - PUT
          - DELETE
          description: type=http
        params:
          type: array
          items:
            type: object
            required:
            - name
            - type
            - required
            properties:
              name:
                type: string
              type:
                type: string
                enum:
                - string
                - number
                - boolean
              required:
                type: boolean
              description:
                type: string
        type:
          type: string
          enum:
          - http
          - mcp
          - cli
          - skill
          description: http=API 接口（HTTP）；mcp=MCP 工具；cli=CLI 命令；skill=技能/工作流。平台只登记，执行在 Bot。
        url:
          type: string
          description: type=http
        skill_id:
          type: string
          description: type=skill
        platform:
          type: string
          description: type=skill，技能/工作流所属平台
        output_description:
          type: string
          description: type=skill
        mcp_server:
          type: string
          description: type=mcp，MCP Server URL
        mcp_tool:
          type: string
          description: type=mcp
        input_schema:
          type: object
          description: type=mcp 时为注册的 inputSchema；其他类型（http / cli / skill）由 params 生成。意图里的入参映射（槽位 / 常量 / 上下文）对四种类型一致
        auth:
          type: string
          enum:
          - 无
          - API Key
          - Bearer Token
          - OAuth2
          description: type=http，鉴权方式；密钥由平台托管，不在接口中返回
        cli:
          type: object
          description: type=cli 时返回
          required:
          - bin
          - command_template
          properties:
            bin:
              type: string
              example: xclaw-cli
              description: 可执行程序名
            command_template:
              type: string
              example: xclaw-cli mall mall-product detail get --sku {sku} --locale {locale} --include-mainpicture {include_mainpicture} --json
              description: 命令 / 子命令模板，{参数名} 引用入参；选填参数为空时连同其前面的 --选项 一起省略
            auth:
              type: string
              enum:
              - 无
              - CLI 内置登录（OAuth）
              - 环境变量 Token
              description: 所需鉴权
            login_command:
              type: string
              example: xclaw-cli auth login
              description: Bot 运行环境首次使用或 Token 过期时执行的登录命令
            install:
              type: string
              example: curl -fsSL https://open.westmonth.com/install | bash
              description: 所需环境 / 安装方式
            verified_version:
              type: string
              example: 2.2.10
              description: 登记时验证过的 CLI 版本
            output_format:
              type: string
              enum:
              - json
              - text
            confirm_required:
              type: boolean
              description: 写操作，Bot 执行前需用户确认
            output_description:
              type: string
        source:
          type: string
          enum:
          - external
          - builtin
          description: external=技术注册的外部工具；builtin=平台内置工具（本平台自己的接口，不可编辑/删除）
        maintenance:
          type: boolean
          description: source=builtin 时返回；true=维护类（写回意图、槽位写入/删除、导入知识），不能关联到意图
        space_scoped:
          type: boolean
          description: source=builtin 时返回；true=调用时需带 X-Space-Id
        endpoints:
          type: array
          items:
            type: string
          description: source=builtin 时返回，该能力合并的 REST 接口
          example:
          - POST /api/v1/kbs/{kb_id}/search
        mcp_tools:
          type: array
          items:
            type: string
          description: source=builtin 时返回，对应的 MCP 工具
          example:
          - search_knowledge
      description: 工具全平台通用，不区分业务空间。
