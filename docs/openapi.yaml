          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      parameters:
      - name: source
        in: query
        required: false
        schema:
          type: string
          enum:
          - external
          - builtin
        description: 按来源筛选

    post:
      tags:
      - 工具
      operationId: upsertTool
      summary: 按工具名创建或更新
      description: |
        需要「工具:写」。以 name 为稳定编码做幂等写入：不存在则创建（201），已存在则更新（200）。
        dry_run=true 时只校验不写入，也不需要 Idempotency-Key。
        不能用本接口单独注册 MCP 子工具，请先 POST /api/v1/mcp-servers 再同步。
        不能注册或修改平台内置工具。HTTP 的 secret 不会出现在响应里。
        写操作类工具仍通过 config.confirm_required 标记，Bot 调用前须向用户确认。
        工具全平台通用，不需要 X-Space-Id。开放接口不能删除工具，请用停用。
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToolUpsert'
            examples:
              http:
                summary: HTTP 工具
                value:
                  name: inventory_lookup
                  type: http
                  display_name: 库存查询
                  description: 按商品编码查询当前可售库存。
                  owner: 运营
                  params:
                  - name: sku
                    type: string
                    required: true
                    description: 商品编码
                  config:
                    url: https://example.com/inventory
                    method: GET
                    auth: 无
              cli:
                summary: CLI 工具
                value:
                  name: order_query_cli
                  type: cli
                  display_name: 订单查询
                  description: 在运行环境用命令行查询订单状态。
                  owner: 运营
                  params:
                  - name: order_id
                    type: string
                    required: true
                    description: 订单号
                  config:
                    bin: mycli
                    command_template: mycli order get {order_id}
                    auth: 无
                    output_format: json
                    confirm_required: false
              dry_run:
                summary: 只校验
                value:
                  name: inventory_lookup
                  type: http
                  display_name: 库存查询
                  description: 按商品编码查询当前可售库存。
                  owner: 运营
                  params: []
                  config:
                    url: https://example.com/inventory
                    method: GET
                    auth: 无
                  dry_run: true
      responses:
        '200':
          description: 更新成功，或 dry_run 校验通过
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ToolWrite'
                - $ref: '#/components/schemas/DryRunTool'
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolWrite'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
