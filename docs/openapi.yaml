  /api/v1/intents:
    get:
      tags:
      - 意图
      operationId: listIntents
      summary: 查询意图列表
      description: '何时用：写入前查重（按 q 搜名称/例句，或按 category 列出同类意图）；增量同步时用 updated_after。

        何时不用：已知编码时直接用 GET /api/v1/intents/{code} 读详情。

        Bot 只应读取 status=启用 的意图。

        '
      parameters:
      - name: category
        in: query
        schema:
          type: string
          example: STOCK/现货
        description: 分类路径，每段填编码或名称，用 / 分隔；可以只写前几层（返回该分类及其下级的全部意图）；路径不存在时返回空列表
      - name: l1
        in: query
        schema:
          type: string
          example: STOCK
        description: 0.5 版参数（兼容）：等价于 category 第 1 段
        deprecated: true
      - name: l2
        in: query
        schema:
          type: string
          example: 现货
        description: 0.5 版参数（兼容）：与 l1 一起使用，等价于 category 第 2 段
        deprecated: true
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/IntentStatus'
      - name: q
        in: query
        schema:
          type: string
          example: 现货
        description: 关键词，匹配编码、名称、意图描述、例句
      - name: updated_after
        in: query
        schema:
          type: string
          format: date-time
        description: 只返回该时间之后更新的意图
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: page_size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: 意图列表
          content:
            application/json:
              schema:
                type: object
                required:
                - total
                - items
                properties:
                  total:
                    type: integer
                    example: 123
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/IntentSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    parameters:
    - $ref: '#/components/parameters/SpaceHeader'
    - $ref: '#/components/parameters/SpaceQuery'
  /api/v1/intents/{code}:
    parameters:
    - $ref: '#/components/parameters/SpaceHeader'
    - $ref: '#/components/parameters/SpaceQuery'
    - name: code
      in: path
      required: true
