                        source: 槽位
                      carriage:
                        value: carriage
                        source: 槽位
                      order_id:
                        value: order_id
                        source: 槽位
                      entry_discounts:
                        value: entry_discounts
                        source: 槽位
                  - tool: xclaw_platform_alibaba_product_get
                    type: cli
                    param_map:
                      scene:
                        value: '1688'
                        source: 常量
                      shop_id:
                        value: shop_id
                        source: 槽位
                      web_site:
                        value: '1688'
                        source: 常量
                      product_id:
                        value: offer_id
                        source: 槽位
                validation_sets:
                - kb_id: kb_cs_reply
                  kb_name: 1688客服-回复规则与禁止项
                  doc_id: RULE
                  doc_name: 回复规则与禁止项_v1.json
                  chunk_id: RULE-13
