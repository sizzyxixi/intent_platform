name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: intent
          POSTGRES_PASSWORD: intent
          POSTGRES_DB: intent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U intent" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PGPASSWORD: intent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: 安装后端依赖
        run: |
          python -m venv .venv
          .venv/bin/pip install -r backend/requirements-dev.txt
      - name: 创建测试库
        run: psql -h 127.0.0.1 -U intent -d intent -c "CREATE DATABASE intent_test"
      - name: 后端测试（pytest）
        working-directory: backend
        run: ../.venv/bin/python -m pytest -q
        env:
          IP_DATABASE_URL: postgresql+psycopg://intent:intent@127.0.0.1:5432/intent_test

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 前端构建（tsc + vite）
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: 端到端测试（Playwright）
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
        env:
          E2E_DATABASE_URL: postgresql+psycopg://intent:intent@127.0.0.1:5432/intent_e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: |
            frontend/test-results
            screenshots
          if-no-files-found: ignore

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验 docker compose 配置
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env config -q
      - name: 构建镜像
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env build
